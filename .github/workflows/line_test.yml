name: LINE送信テスト

on:
  workflow_dispatch:

jobs:
  send-test:
    name: LINE確認メッセージ送信
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: トークン有効期限診断（トークン本体は出力しない）
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          python -c "
          import os, json, urllib.request, urllib.parse, urllib.error

          token = os.environ['LINE_CHANNEL_TOKEN']
          data = urllib.parse.urlencode({'access_token': token}).encode()
          req = urllib.request.Request('https://api.line.me/oauth2/v2.1/verify', data=data, method='POST')
          try:
              with urllib.request.urlopen(req) as res:
                  body = json.loads(res.read())
                  expires_in = body.get('expires_in')
                  days = expires_in / 86400 if isinstance(expires_in, (int, float)) else None
                  print('VALID. client_id=', body.get('client_id'))
                  print('expires_in(sec)=', expires_in, ' ≒', round(days, 1) if days else None, 'days')
          except urllib.error.HTTPError as e:
              print('INVALID/EXPIRED', e.code, e.read().decode(errors='replace'))
          "
