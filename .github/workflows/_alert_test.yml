name: （検証用）失敗時アラートのテスト

on:
  workflow_dispatch:

jobs:
  fail-on-purpose:
    name: わざと失敗させてアラート送信をテスト
    runs-on: ubuntu-latest
    steps:
      - name: わざと失敗する
        run: exit 1
      - name: 失敗時にLINEへアラート
        if: failure()
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_TOKEN" \
            -d "{\"to\":\"U206a030c1759f1ed8f4c684d03d11915\",\"messages\":[{\"type\":\"text\",\"text\":\"🧪これは失敗時アラートの動作確認テストです。実際の障害ではありません。\n詳細: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}" \
            -w "\nHTTP_STATUS:%{http_code}\n"
